<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="1200" height="720" fill="#fcfcfb"/><text x="48" y="64" font-size="30" font-weight="600" fill="#0b0b0b">How closely LLM judges match human rubric grades</text><text x="48" y="98" font-size="19" fill="#52514e">Pearson r with the human 1-5 score on 320 answers to 80 BiGGen-Bench prompts. Bars are 95% intervals.</text><circle cx="55" cy="134" r="6" fill="#2a78d6"/><text x="70" y="140" font-size="18" fill="#0b0b0b">Small open model, run locally (4-bit)</text><circle cx="405" cy="134" r="6" fill="#6f6e69"/><text x="420" y="140" font-size="18" fill="#0b0b0b">Large judge (scores from the dataset)</text><text x="48" y="198" font-size="22" font-weight="600" fill="#0b0b0b">Every judge, full rubric</text><text x="48" y="224" font-size="16" fill="#52514e">Higher means closer to the human grader</text><line x1="298.0" x2="298.0" y1="240" y2="572" stroke="#e1e0d9" stroke-width="1"/><text x="298.0" y="596" font-size="15" fill="#898781" text-anchor="middle">0.0</text><line x1="378.0" x2="378.0" y1="240" y2="572" stroke="#e1e0d9" stroke-width="1"/><text x="378.0" y="596" font-size="15" fill="#898781" text-anchor="middle">0.2</text><line x1="458.0" x2="458.0" y1="240" y2="572" stroke="#e1e0d9" stroke-width="1"/><text x="458.0" y="596" font-size="15" fill="#898781" text-anchor="middle">0.4</text><line x1="538.0" x2="538.0" y1="240" y2="572" stroke="#e1e0d9" stroke-width="1"/><text x="538.0" y="596" font-size="15" fill="#898781" text-anchor="middle">0.6</text><line x1="618.0" x2="618.0" y1="240" y2="572" stroke="#e1e0d9" stroke-width="1"/><text x="618.0" y="596" font-size="15" fill="#898781" text-anchor="middle">0.8</text><line x1="298.0" x2="618.0" y1="572" y2="572" stroke="#c3c2b7" stroke-width="1"/><text x="48" y="279.0" font-size="16" fill="#0b0b0b">GPT-4 Turbo (2024-04-09)</text><line x1="499.8" x2="575.0" y1="273.0" y2